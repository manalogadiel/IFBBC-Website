<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Requests — IFBBC Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">
        IFBBC Admin
        <small>Church Administration</small>
      </div>
      <ul class="admin-nav-links">
        <li><a href="/admin/dashboard.html" class="is-active">Prayer Requests</a></li>
        <li><a href="/admin/posters.html">Poster Manager</a></li>
        <li style="margin-top:auto;padding-top:var(--sp-8);border-top:1px solid rgba(255,255,255,0.1);">
          <a href="/" style="color:rgba(255,255,255,0.5);">← Back to website</a>
        </li>
        <li>
          <a href="#" data-logout style="color:rgba(255,255,255,0.5);">Sign Out</a>
        </li>
      </ul>
    </aside>

    <!-- Main -->
    <main class="admin-main" id="main-content">
      <h1 class="admin-page-title">Prayer Requests</h1>

      <!-- Filter -->
      <div style="display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-6);flex-wrap:wrap;">
        <label for="status-filter" style="font-size:var(--text-sm);font-weight:600;color:var(--c-ink);">Filter by status:</label>
        <select id="status-filter" class="form-select" style="width:auto;min-width:160px;">
          <option value="all">All Requests</option>
          <option value="pending">Pending Review</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="private">Private</option>
        </select>
        <button class="btn btn--ghost btn--sm" onclick="loadPrayerRequests()">
          Refresh
        </button>
      </div>

      <!-- Table -->
      <div class="schedule-table-wrap" style="margin-bottom:var(--sp-12);">
        <table class="prayer-admin-table" aria-label="All prayer requests">
          <thead>
            <tr>
              <th>Request</th>
              <th>Status</th>
              <th>Visibility</th>
              <th>Name</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="prayer-tbody">
            <tr><td colspan="6" style="text-align:center;padding:2rem;">
              <div class="spinner"></div>
            </td></tr>
          </tbody>
        </table>
      </div>

      <!-- Change Password -->
      <div style="max-width:420px;">
        <h2 style="font-family:var(--font-heading);font-size:var(--text-2xl);color:var(--c-ink);margin-bottom:var(--sp-6);">
          Change Admin Password
        </h2>
        <div id="pw-message" aria-live="polite"></div>
        <form id="change-pw-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="current-pw">Current Password</label>
            <input class="form-input" type="password" id="current-pw" required autocomplete="current-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="new-pw">New Password</label>
            <input class="form-input" type="password" id="new-pw" required minlength="8"
                   autocomplete="new-password" placeholder="Minimum 8 characters">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-pw">Confirm New Password</label>
            <input class="form-input" type="password" id="confirm-pw" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn--primary">Change Password</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAdminAuth();
      loadPrayerRequests();
    });
  </script>
</body>
</html>
